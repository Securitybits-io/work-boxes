name: Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Provisioning validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git ruby python3 python3-yaml \
            yamllint shellcheck ansible-core ansible-lint

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r Scripts/linux/requirements.yml

      - name: Run validation
        run: bash Scripts/validate.sh
