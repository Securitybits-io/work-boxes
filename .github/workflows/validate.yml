---
name: Validation

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Provisioning validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install validation system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git ruby shellcheck python3-venv

      - name: Create isolated validation environment
        run: |
          /usr/bin/python3 -m venv "$RUNNER_TEMP/validation-venv"
          "$RUNNER_TEMP/validation-venv/bin/python" -m pip install \
            --disable-pip-version-check -r .github/requirements-ci.txt
          echo "$RUNNER_TEMP/validation-venv/bin" >> "$GITHUB_PATH"

      - name: Verify validation toolchain
        run: |
          command -v python3 ansible-playbook ansible-galaxy ansible-lint yamllint
          python3 --version
          python3 -m pip check
          python3 -c 'import ansible; print("Ansible Python module:", ansible.__version__, ansible.__file__)'
          ansible-playbook --version
          ansible-lint --version
          yamllint --version

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r Scripts/linux/requirements.yml

      - name: Run validation
        run: bash Scripts/validate.sh
