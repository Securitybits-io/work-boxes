---
- name: Install workstation tools
  hosts: all
  become: true
  gather_facts: false

  vars_files:
    - ../vars.yml

  vars:
    workbox_base_tools:
      - vim
      - curl
      - unzip
      - sublist3r
      - gobuster
      - terminator
      - seclists
      - zaproxy

  tasks:
    - name: Install base and extra tools in one package transaction
      ansible.builtin.apt:
        name: "{{ (workbox_base_tools + (workbox_extra_tools | default([]))) | unique | list }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
