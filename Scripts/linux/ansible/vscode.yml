---
- name: Install Visual Studio Code
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Install repository dependencies
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure the APT keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download the Microsoft signing key
      ansible.builtin.get_url:
        url: https://packages.microsoft.com/keys/microsoft.asc
        dest: /etc/apt/keyrings/packages.microsoft.asc
        owner: root
        group: root
        mode: "0644"

    - name: Configure the Visual Studio Code repository
      ansible.builtin.apt_repository:
        repo: deb [arch=amd64 signed-by=/etc/apt/keyrings/packages.microsoft.asc] https://packages.microsoft.com/repos/vscode stable main
        state: present
        filename: VSCode
        update_cache: true

    - name: Install Visual Studio Code
      ansible.builtin.apt:
        name: code
        state: present
