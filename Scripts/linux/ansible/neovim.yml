---
- name: Setup Neovim with LazyVim
  hosts: localhost
  become: yes

  vars:
    user: "root"
    nvim_config_path: "/home/root/.config/nvim"

  tasks:
    - name: Install required packages
      apt:
        name:
          - neovim
          - git
          - ripgrep
          - fd-find
        update_cache: yes

    - name: Ensure fd is symlinked as 'fd'
      file:
        src: /usr/bin/fdfind
        dest: /usr/local/bin/fd
        state: link
      when: ansible_distribution == "Ubuntu"

    - name: Remove default nvim config (if any)
      file:
        path: "{{ nvim_config_path }}"
        state: absent

    - name: Clone LazyVim starter
      git:
        repo: "https://github.com/LazyVim/starter"
        dest: "{{ nvim_config_path }}"
        version: "main"
        accept_hostkey: yes
      become: false
      become_user: "{{ user }}"

    - name: Add extra plugins to LazyVim
      blockinfile:
        path: "{{ nvim_config_path }}/lua/plugins/nvim-tree.lua"
        create: yes
        block: |
          return {
            {
              "nvim-tree/nvim-tree.lua",
              dependencies = { "nvim-tree/nvim-web-devicons" },
              config = function()
                require("nvim-tree").setup()
              end,
            },
          }

    - name: Trigger Neovim headless plugin install
      command: >
        nvim --headless "+Lazy! sync" +qa
      become: false
      become_user: "{{ user }}"
      environment:
        XDG_CONFIG_HOME: "/home/{{ user }}/.config"
        XDG_DATA_HOME: "/home/{{ user }}/.local/share"